# =============================================
# DeepAudit v3.0.4 外网生产部署配置
# =============================================
# 适用场景: 将 DeepAudit 开放到公网访问
#
# 快速部署:
#   cp .env.prod.example .env.prod
#   vim .env.prod               # 填入 LLM API Key 等配置
#   docker compose -f docker-compose.external.yml up -d
#
# HTTPS 部署:
#   bash scripts/setup-ssl.sh   # 自动申请 Let's Encrypt 证书
#   docker compose -f docker-compose.external.yml --profile https up -d
#
# 安全说明:
#   - 数据库和 Redis 不对外暴露端口
#   - 后端 API 只通过 Nginx 代理访问，不直接暴露
#   - 默认密码已被环境变量替换，请务必修改 .env.prod
# =============================================

services:
  # ─────────────────────────────────────────
  # 数据库（不对外暴露端口）
  # ─────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER:-deepaudit}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?请在 .env.prod 中设置 DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-deepaudit}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-deepaudit}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # 生产环境不暴露数据库端口到宿主机
    networks:
      - deepaudit-internal

  # ─────────────────────────────────────────
  # Redis（不对外暴露端口）
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-deepaudit_redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-deepaudit_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deepaudit-internal

  # ─────────────────────────────────────────
  # 数据库迁移（启动一次后退出）
  # ─────────────────────────────────────────
  db-migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/lintsinghua/deepaudit-backend:latest}
    restart: "no"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-deepaudit}:${DB_PASSWORD}@db:5432/${DB_NAME:-deepaudit}
    command: [".venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - deepaudit-internal

  # ─────────────────────────────────────────
  # 后端 API（不直接对外暴露，通过 Nginx 代理）
  # ─────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/lintsinghua/deepaudit-backend:latest}
    restart: unless-stopped
    volumes:
      - backend_uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    # 生产环境不暴露 8000 端口到宿主机，由 Nginx 内部代理
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-deepaudit}:${DB_PASSWORD}@db:5432/${DB_NAME:-deepaudit}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-deepaudit_redis_secret}@redis:6379/0
      - AGENT_ENABLED=true
      - SANDBOX_ENABLED=${SANDBOX_ENABLED:-true}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-ghcr.io/lintsinghua/deepaudit-sandbox:latest}
      # JWT 密钥（必须修改为随机字符串）
      - SECRET_KEY=${SECRET_KEY:?请在 .env.prod 中设置 SECRET_KEY}
      # LLM 配置
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      # 禁用代理
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=*
      - no_proxy=*
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - deepaudit-internal

  # ─────────────────────────────────────────
  # 前端 + Nginx 反向代理（对外暴露 80/443）
  # ─────────────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/lintsinghua/deepaudit-frontend:latest}
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP（会跳转到 HTTPS）
      - "443:443"     # HTTPS（需要配置证书）
    volumes:
      # HTTP-only 模式（默认）
      - ./frontend/nginx.external.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS 模式（配置证书后切换，取消下面两行注释）
      # - ./frontend/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs:/etc/nginx/certs:ro
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=*
    depends_on:
      - backend
    networks:
      - deepaudit-internal

  # ─────────────────────────────────────────
  # 沙箱镜像预拉取
  # ─────────────────────────────────────────
  sandbox-pull:
    image: ${SANDBOX_IMAGE:-ghcr.io/lintsinghua/deepaudit-sandbox:latest}
    restart: "no"
    command: echo "Sandbox image ready"

networks:
  deepaudit-internal:
    driver: bridge
    # 内部网络，容器间通信，不暴露到宿主机网络

volumes:
  postgres_data:
  backend_uploads:
  redis_data:
